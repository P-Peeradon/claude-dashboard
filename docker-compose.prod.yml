# Production stack: Nginx (TLS) -> Next.js -> PostgreSQL 18.
# Only Nginx publishes ports. The app and the database are reachable only on the internal network.
#
# Run with:  docker compose --env-file .env.production --env-file .env.images -f docker-compose.prod.yml up -d
name: lemak-cafe

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # PostgreSQL 18+ images keep data in /var/lib/postgresql/18/docker, so the volume is mounted
      # one level up. Mounting it at /var/lib/postgresql/data (the pre-18 layout) breaks upgrades.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot job: applies pending migrations, then exits. The app waits for it to succeed.
  migrate:
    image: ${MIGRATOR_IMAGE}
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    image: ${APP_IMAGE}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      # The official image runs envsubst on /etc/nginx/templates/*.template, filling in ${DOMAIN}.
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${TLS_CERT_DIR}:/etc/nginx/certs:ro
      - certbot-webroot:/var/www/certbot:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      app:
        condition: service_healthy

volumes:
  pgdata:
  certbot-webroot:
